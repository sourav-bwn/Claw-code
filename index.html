<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uclaw - Free AI Chat 🤖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            margin: 15px 0;
        }

        .chat-box {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
            backdrop-filter: blur(10px);
        }

        .messages {
            height: 350px;
            overflow-y: auto;
            padding: 10px;
        }

        .msg {
            padding: 15px 20px;
            border-radius: 15px;
            margin: 10px 0;
            max-width: 85%;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .msg.ai {
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 5px;
        }

        .typing span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #6366f1;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid transparent;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: #6366f1; }
        input::placeholder { color: #94a3b8; }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .status.ready { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status.error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status.loading { background: rgba(99, 102, 241, 0.2); color: #818cf8; }

        .api-setup {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
        }

        .api-setup h3 {
            color: #a855f7;
            margin-bottom: 10px;
        }

        .api-key-input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 0.9rem;
            margin: 10px 0;
        }

        .api-key-input:focus { border-color: #6366f1; outline: none; }

        .features {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .feature {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .feature .icon { font-size: 1.5rem; }
        .feature p { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }

        @media (max-width: 600px) {
            .features { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 1.8rem; }
            .msg { max-width: 95%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🐾</div>
            <h1>Uclaw</h1>
            <div class="badge">🎉 100% FREE - No Setup!</div>
            <p style="color: #94a3b8;">Just type and chat - it's that simple!</p>
        </header>

        <div class="features">
            <div class="feature"><div class="icon">💬</div><p>Chat</p></div>
            <div class="feature"><div class="icon">✍️</div><p>Write</p></div>
            <div class="feature"><div class="icon">🔍</div><p>Research</p></div>
            <div class="feature"><div class="icon">💡</div><p>Ideas</p></div>
        </div>

        <div class="api-setup">
            <h3>🔑 Free API Key (Optional)</h3>
            <p style="color: #94a3b8; font-size: 0.9rem;">
                For better AI, get a free key from 
                <a href="https://console.groq.com" target="_blank" style="color: #818cf8;">Groq</a> 
                or <a href="https://huggingface.co" target="_blank" style="color: #818cf8;">HuggingFace</a>
            </p>
            <input type="password" id="apiKey" class="api-key-input" placeholder="Paste your free API key here (optional)">
            <button onclick="saveApiKey()" style="padding: 10px 20px; font-size: 0.9rem;">Save Key</button>
            <p id="keyStatus" style="color: #22c55e; font-size: 0.8rem; margin-top: 5px;"></p>
        </div>

        <div class="chat-box">
            <div id="status" class="status loading">⏳ Initializing AI...</div>
            <div class="messages" id="messages"></div>
            <div class="input-row">
                <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter')send()">
                <button onclick="send()" id="sendBtn">Send 🚀</button>
            </div>
        </div>

        <footer style="text-align: center; padding: 30px; color: #64748b;">
            <p>Made with ❤️ | <a href="https://github.com/KING-SS-OFFICIAL/Claw-code" style="color: #818cf8;">GitHub</a></p>
        </footer>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        const apiKeyInput = document.getElementById('apiKey');
        const keyStatus = document.getElementById('keyStatus');

        let apiKey = localStorage.getItem('uc law_api_key') || '';
        let currentModel = 'llama-3.1-8b-instruct';
        let conversation = [];

        // Auto-load saved API key
        if (apiKey) {
            apiKeyInput.value = '••••••••••••';
            keyStatus.textContent = '✅ API key saved!';
            currentModel = 'mixtral-8x7b-32768'; // Better model with API key
        }

        // Groq API (FREE, fast)
        const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `msg ${isUser ? 'user' : 'ai'}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.id = 'typing';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            document.getElementById('typing')?.remove();
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key && !key.includes('••')) {
                apiKey = key;
                localStorage.setItem('uc law_api_key', key);
                keyStatus.textContent = '✅ API key saved!';
                apiKeyInput.value = '••••••••••••';
                currentModel = 'mixtral-8x7b-32768';
                status.textContent = '🚀 Using premium model with your API key!';
                status.className = 'status ready';
            }
        }

        function addWelcome() {
            addMessage("Hey! 👋 I'm Uclaw, your free AI assistant!\n\nI can help you with:\n• Answering questions\n• Writing essays or emails\n• Writing code\n• Explaining topics\n• Brainstorming ideas\n\nJust type below and I'll respond instantly! 🚀");
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            conversation.push({ role: 'user', content: text });

            try {
                let response;

                if (apiKey && !apiKey.includes('••')) {
                    // Use Groq API (FREE with key)
                    response = await fetch(GROQ_API_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: currentModel,
                            messages: conversation,
                            max_tokens: 2048,
                            temperature: 0.7
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        response = data.choices[0].message.content;
                    } else {
                        throw new Error('API error');
                    }
                } else {
                    // Use free HuggingFace Inference API
                    response = await freeChat(text);
                }

                hideTyping();
                addMessage(response);
                conversation.push({ role: 'assistant', content: response });
                status.textContent = '✅ Ready!';
                status.className = 'status ready';

            } catch (err) {
                hideTyping();
                addMessage("Hmm, I'm having trouble connecting. Try getting a free API key from Groq for better results! 🙏");
                status.textContent = '⚠️ Using fallback mode';
                status.className = 'status error';
            }

            sendBtn.disabled = false;
        }

        async function freeChat(message) {
            // Free model from HuggingFace
            const response = await fetch('https://api-inference.huggingface.co/models/meta-llama/Llama-3.2-1B-Instruct/v1/chat', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer hf_demo',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    inputs: message,
                    parameters: { max_new_tokens: 200 }
                })
            });

            if (response.ok) {
                const data = await response.json();
                return data[0]?.generated_text || "I received your message! For full functionality, please add a free API key.";
            }

            // Fallback responses
            return getSmartResponse(message);
        }

        function getSmartResponse(message) {
            const msg = message.toLowerCase();
            
            const responses = {
                greeting: ["Hello! 👋 How can I help you today?", "Hey there! What can I do for you?", "Hi! I'm here to help!"],
                help: ["I can help with: coding, writing, research, brainstorming, and answering questions. Just ask!"],
                thanks: ["You're welcome! 😊 Anything else I can help with?", "Happy to help! Let me know if you need anything else."],
                goodbye: ["Goodbye! 👋 Come back anytime!", "See you later! 💫"],
                howareyou: ["I'm doing great! Ready to help you! 🚀", "Fantastic! How can I assist you today?"],
            };

            if (msg.match(/hello|hi|hey|sup/)) return responses.greeting[Math.floor(Math.random() * responses.greeting.length)];
            if (msg.match(/help|what can you do|capabilities/)) return responses.help[0];
            if (msg.match(/thank|thanks/)) return responses.thanks[Math.floor(Math.random() * responses.thanks.length)];
            if (msg.match(/bye|goodbye|exit/)) return responses.goodbye[Math.floor(Math.random() * responses.goodbye.length)];
            if (msg.match(/how are you|howdo you do/)) return responses.howareyou[Math.floor(Math.random() * responses.howareyou.length)];

            return `I understand you're asking about: "${message.slice(0, 50)}..."\n\nFor full AI responses, get a FREE API key from https://console.groq.com - it takes 30 seconds!`;
        }

        // Initialize
        setTimeout(() => {
            status.textContent = '✅ Ready! Type a message to start chatting!';
            status.className = 'status ready';
            addWelcome();
        }, 1000);
    </script>
</body>
</html>
