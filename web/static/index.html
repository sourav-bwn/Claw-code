<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uclaw - Unified AI Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .model-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }

        .new-chat-btn:hover {
            opacity: 0.9;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .session-item {
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 0.5rem;
            transition: background 0.2s;
        }

        .session-item:hover {
            background: var(--bg-tertiary);
        }

        .session-item.active {
            background: var(--bg-tertiary);
            border: 1px solid var(--accent-primary);
        }

        .session-title {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message-content {
            padding: 1rem 1.5rem;
            border-radius: 16px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background: var(--accent-gradient);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message.role {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-area {
            padding: 1.5rem 2rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            min-height: 56px;
            max-height: 200px;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .send-btn {
            padding: 1rem 1.5rem;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 2rem;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            margin-bottom: 2rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            max-width: 700px;
        }

        .feature-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .feature-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .feature-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .feature-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .feature-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }

        .status-bar {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-indicator.error {
            background: var(--error);
        }

        .status-indicator.warning {
            background: var(--warning);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .feature-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">U</div>
            <span class="logo-text">Uclaw</span>
            <span style="color: var(--success); font-size: 0.75rem; margin-left: 0.5rem;">FREE</span>
        </div>
        <div class="header-actions">
            <select class="model-select" id="providerSelect" onchange="updateModels()">
                <option value="ollama">Ollama (FREE)</option>
                <option value="anthropic">Claude (API Key)</option>
                <option value="openai">GPT-4 (API Key)</option>
                <option value="gemini">Gemini (API Key)</option>
            </select>
            <select class="model-select" id="modelSelect">
                <option value="llama3.2">Llama 3.2</option>
                <option value="codellama">Code Llama</option>
                <option value="mistral">Mistral</option>
            </select>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="newChat()">
                    <span>+</span> New Chat
                </button>
            </div>
            <div class="sessions-list" id="sessionsList">
                <!-- Sessions will be loaded here -->
            </div>
        </aside>

        <section class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🤖</div>
                    <h1 class="welcome-title">Welcome to Uclaw</h1>
                    <p class="welcome-subtitle">Your unified AI coding assistant</p>
                    <div class="feature-grid">
                        <div class="feature-card" onclick="sendPreset('Explain this codebase structure')">
                            <div class="feature-icon">📁</div>
                            <div class="feature-title">Code Analysis</div>
                            <div class="feature-desc">Understand codebases</div>
                        </div>
                        <div class="feature-card" onclick="sendPreset('Help me write a function that...')">
                            <div class="feature-icon">✍️</div>
                            <div class="feature-title">Code Generation</div>
                            <div class="feature-desc">Write better code</div>
                        </div>
                        <div class="feature-card" onclick="sendPreset('Review my code for bugs')">
                            <div class="feature-icon">🔍</div>
                            <div class="feature-title">Code Review</div>
                            <div class="feature-desc">Find issues early</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Ask Uclaw anything..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </section>
    </main>

    <div class="status-bar" id="statusBar">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusText">Ready</span>
    </div>

    <script>
        let currentSessionId = null;
        let isLoading = false;
        let currentProvider = 'ollama';

        const apiBase = '/api';

        const modelsByProvider = {
            ollama: [
                { value: 'llama3.2', name: 'Llama 3.2' },
                { value: 'llama3.2:70b', name: 'Llama 3.2 70B' },
                { value: 'codellama', name: 'Code Llama' },
                { value: 'mistral', name: 'Mistral' },
                { value: 'phi', name: 'Phi' }
            ],
            anthropic: [
                { value: 'claude-sonnet-4-6', name: 'Claude Sonnet 4' },
                { value: 'claude-opus-4-6', name: 'Claude Opus 4' },
                { value: 'claude-haiku-4-5-20251213', name: 'Claude Haiku 4' }
            ],
            openai: [
                { value: 'gpt-4o', name: 'GPT-4o' },
                { value: 'gpt-4o-mini', name: 'GPT-4o Mini' },
                { value: 'gpt-4-turbo', name: 'GPT-4 Turbo' }
            ],
            gemini: [
                { value: 'gemini-2.0-flash', name: 'Gemini 2.0 Flash' },
                { value: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro' },
                { value: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash' }
            ]
        };

        function updateModels() {
            const provider = document.getElementById('providerSelect').value;
            const modelSelect = document.getElementById('modelSelect');
            currentProvider = provider;
            
            modelSelect.innerHTML = modelsByProvider[provider]
                .map(m => `<option value="${m.value}">${m.name}</option>`)
                .join('');
        }

        async function newChat() {
            const model = document.getElementById('modelSelect').value;
            try {
                const response = await fetch(`${apiBase}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model })
                });
                const session = await response.json();
                currentSessionId = session.id;
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('messagesContainer').innerHTML = '';
                loadSessions();
            } catch (error) {
                console.error('Failed to create session:', error);
            }
        }

        async function loadSessions() {
            try {
                const response = await fetch(`${apiBase}/sessions`);
                const sessions = await response.json();
                const list = document.getElementById('sessionsList');
                list.innerHTML = sessions.map(s => `
                    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" 
                         onclick="loadSession('${s.id}')">
                        <div class="session-title">${s.message_count > 0 ? 'Chat' : 'New Chat'}</div>
                        <div class="session-meta">${new Date(s.created_at).toLocaleDateString()} · ${s.model}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        async function loadSession(sessionId) {
            currentSessionId = sessionId;
            document.getElementById('welcomeScreen').classList.add('hidden');
            
            try {
                const response = await fetch(`${apiBase}/sessions/${sessionId}/messages`);
                const messages = await response.json();
                renderMessages(messages);
                loadSessions();
            } catch (error) {
                console.error('Failed to load session:', error);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = messages.map(m => `
                <div class="message ${m.role}">
                    <div class="role">${m.role}</div>
                    <div class="message-content">${escapeHtml(m.content)}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || isLoading) return;

            if (!currentSessionId) {
                await newChat();
            }

            input.value = '';
            isLoading = true;
            updateStatus('thinking', 'Thinking...');

            const messagesContainer = document.getElementById('messagesContainer');
            document.getElementById('welcomeScreen').classList.add('hidden');

            messagesContainer.innerHTML += `
                <div class="message user">
                    <div class="message-content">${escapeHtml(message)}</div>
                </div>
                <div class="message assistant" id="loadingMessage">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const model = document.getElementById('modelSelect').value;
                const provider = document.getElementById('providerSelect').value;
                const response = await fetch(`${apiBase}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        session_id: currentSessionId,
                        model,
                        provider
                    })
                });

                const data = await response.json();
                
                document.getElementById('loadingMessage')?.remove();
                
                messagesContainer.innerHTML += `
                    <div class="message assistant">
                        <div class="message-content">${escapeHtml(data.message)}</div>
                    </div>
                `;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                updateStatus('ready', 'Ready');
            } catch (error) {
                document.getElementById('loadingMessage')?.remove();
                messagesContainer.innerHTML += `
                    <div class="message assistant">
                        <div class="message-content" style="color: var(--error);">
                            Error: Failed to get response. Please check your API key.
                        </div>
                    </div>
                `;
                updateStatus('error', 'Error');
            }

            isLoading = false;
            loadSessions();
        }

        function sendPreset(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function updateStatus(status, text) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            indicator.className = 'status-indicator';
            if (status === 'error') indicator.classList.add('error');
            if (status === 'thinking') indicator.classList.add('warning');
            statusText.textContent = text;
        }

        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        loadSessions();
        updateStatus('ready', '💡 Ollama (FREE) selected - no API key needed!');
    </script>
</body>
</html>
