[package]
name = "uc law-api"
version = "0.1.0"
edition = "2021"
authors = ["Uclaw Team"]
license = "MIT"
description = "API client for Uclaw"

[dependencies]
uc law-providers = { path = "../providers" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio-test = "0.4"
