[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/providers",
    "crates/runtime",
    "crates/tools",
    "crates/cli",
    "crates/server",
]

[package]
name = "uc law-workspace"
version = "0.1.0"
edition = "2021"
authors = ["Uclaw Team"]
license = "MIT"
description = "Unified AI Platform"
rust-version = "1.75"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
