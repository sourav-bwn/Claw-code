name: Uclaw Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number'
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic openai

      - name: Run Uclaw Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python << 'EOF'
          import os
          import json
          import subprocess
          import requests

          pr_number = os.environ.get("PR_NUMBER")
          github_token = os.environ.get("GITHUB_TOKEN")
          
          # Get PR details
          pr_response = requests.get(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr_number}",
              headers={"Authorization": f"token {github_token}"}
          )
          pr = pr_response.json()
          
          # Get changed files
          files_response = requests.get(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr_number}/files",
              headers={"Authorization": f"token {github_token}"}
          )
          files = files_response.json()
          
          # Get diff
          diff_response = requests.get(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr_number}",
              headers={"Authorization": f"token {github_token}"}
          )
          
          print(f"Reviewing PR #{pr_number}: {pr.get('title', 'No title')}")
          print(f"Changed files: {len(files)}")
          
          # Build review prompt
          file_summaries = []
          for f in files[:10]:
              file_summaries.append(f"- {f['filename']}: {f['additions']} additions, {f['deletions']} deletions")
          
          prompt = f"""Review this pull request:

Title: {pr.get('title', 'No title')}
Description: {pr.get('body', 'No description')}

Changed files:
{chr(10).join(file_summaries)}

Provide a code review focusing on:
1. Potential bugs or issues
2. Security concerns
3. Code quality improvements
4. Missing tests
5. Documentation gaps

Be concise and actionable."""

          # Call AI for review
          api_key = os.environ.get("ANTHROPIC_API_KEY") or os.environ.get("OPENAI_API_KEY")
          provider = "anthropic" if os.environ.get("ANTHROPIC_API_KEY") else "openai"
          
          review_body = "⚠️ AI Review Unavailable - Please set ANTHROPIC_API_KEY or OPENAI_API_KEY"
          
          if api_key:
              try:
                  if provider == "anthropic":
                      import anthropic
                      client = anthropic.Anthropic(api_key=api_key)
                      response = client.messages.create(
                          model="claude-sonnet-4-6",
                          max_tokens=2048,
                          messages=[{"role": "user", "content": prompt}]
                      )
                      review_body = response.content[0].text
                  else:
                      import openai
                      client = openai.OpenAI(api_key=api_key)
                      response = client.chat.completions.create(
                          model="gpt-4o",
                          messages=[{"role": "user", "content": prompt}]
                      )
                      review_body = response.choices[0].message.content
              except Exception as e:
                  review_body = f"❌ Error generating review: {str(e)}"
          
          # Post review comment
          comment_response = requests.post(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{pr_number}/comments",
              headers={
                  "Authorization": f"token {github_token}",
                  "Content-Type": "application/json"
              },
              json={"body": f"## 🤖 Uclaw Code Review\n\n{review_body}\n\n---\n*Generated by Uclaw AI*"}
          )
          
          print(f"Review posted: {comment_response.status_code == 201}")
          EOF

      - name: Check for secrets
        id: secrets
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" && -z "$OPENAI_API_KEY" ]]; then
            echo "No AI API key configured"
            echo "::warning ::Please set ANTHROPIC_API_KEY or OPENAI_API_KEY secret for AI-powered reviews"
          fi
